<script>
/* GOOGLE SHEETS CONNECTION */

const ATLAS_API_URL = "https://script.google.com/macros/s/AKfycbwlbNgi_qXZTueXo2vT133RcE9iotf95LrTwyVL_LHuic-vRBKYja-jaMjnsFgZUigN/exec";

const protocols = [];
const experiences = {};
let approvedEntries = [];

/* LOAD APPROVED CONTRIBUTIONS */

function loadApprovedEntries() {
  return new Promise((resolve, reject) => {
    const callbackName = "atlasFeed_" + Date.now();
    const script = document.createElement("script");
    let finished = false;

    const cleanUp = () => {
      delete window[callbackName];
      script.remove();
    };

    const timeout = setTimeout(() => {
      if (finished) return;
      finished = true;
      cleanUp();
      reject(new Error("Approved contributions feed timed out."));
    }, 15000);

    window[callbackName] = data => {
      if (finished) return;
      finished = true;
      clearTimeout(timeout);
      cleanUp();

      if (!data || data.success !== true || !Array.isArray(data.entries)) {
        reject(new Error("Unexpected response from Atlas feed."));
        return;
      }

      resolve(data.entries);
    };

    script.onerror = () => {
      if (finished) return;
      finished = true;
      clearTimeout(timeout);
      cleanUp();
      reject(new Error("Could not connect to Atlas feed."));
    };

    script.src = ATLAS_API_URL + "?callback=" +
      encodeURIComponent(callbackName) + "&_=" + Date.now();

    document.head.appendChild(script);
  });
}

function normaliseEntry(entry) {
  const get = key => entry[key] == null ? "" : String(entry[key]).trim();

  return {
    id: get("ID") || "entry-" + Math.random().toString(36).slice(2),
    country: get("Country"),
    type: get("Contribution Type").toLowerCase(),
    title: get("Title") || "Untitled contribution",
    summary: get("Summary"),
    protocolSummary: get("Protocol Summary"),
    year: get("Research Year"),
    discipline: get("Discipline"),
    researchType: get("Research Type"),
    authority: get("Authority"),
    duration: get("Duration"),
    outcome: get("Outcome"),
    cost: get("Cost"),
    experience: get("Experience"),
    advice: get("Advice"),
    source: get("Resources")
  };
}

function refreshAtlasFromSheet() {
  return loadApprovedEntries().then(rows => {
    approvedEntries = rows.map(normaliseEntry).filter(item => item.country);

    Object.keys(experiences).forEach(key => delete experiences[key]);
    protocols.splice(0, protocols.length);

    const countryGroups = new Map();

    approvedEntries.forEach(entry => {
      const key = entry.country.toLowerCase();

      if (!countryGroups.has(key)) countryGroups.set(key, []);
      countryGroups.get(key).push(entry);

      if (
        entry.type === "experience" ||
        entry.type === "advice" ||
        entry.experience ||
        entry.advice
      ) {
        experiences[entry.id] = {
          country: entry.country,
          title: entry.title,
          text: [
            entry.summary,
            entry.experience,
            entry.advice ? "Advice for other researchers\n\n" + entry.advice : "",
            entry.source ? "Resources\n\n" + entry.source : ""
          ].filter(Boolean).join("\n\n"),
          summary: entry.summary,
          year: entry.year,
          discipline: entry.discipline
        };
      }
    });

    countryGroups.forEach((records, key) => {
      const country = records[0].country;
      const protocolRecords = records.filter(item => item.type === "protocol");
      const overview = protocolRecords
        .map(item => item.protocolSummary || item.summary)
        .filter(Boolean).join("\n\n");

      const authorities = [...new Set(
        protocolRecords.map(item => item.authority).filter(Boolean)
      )].join("\n\n");

      const details = protocolRecords.map(item => [
        item.duration ? "Process duration: " + item.duration : "",
        item.outcome ? "Outcome: " + item.outcome : "",
        item.cost ? "Reported cost: " + item.cost : ""
      ].filter(Boolean).join(" / ")).filter(Boolean);

      protocols.push({
        id: "country-" + key.replace(/[^a-z0-9]+/g, "-"),
        country: country,
        code: country.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 2) || "AT",
        title: "Research in " + country,
        updated: "Community contribution",
        status: protocolRecords.length ? "Published contributions" : "Published experiences",
        overview: overview ||
          records.map(item => item.summary).filter(Boolean).join("\n\n") ||
          "Published contributions from researchers working in this country.",
        steps: details.length ? details : [
          "Review the published contributions and check current requirements with the relevant authorities."
        ],
        institutions: authorities ||
          "No institutional details have been included in the approved contributions yet.",
        notes: "This information is based on contributor accounts and may not represent current official guidance. Confirm requirements with the relevant authorities before making plans."
      });
    });

    renderProtocolGrids();
    renderHomeExperiences();

    return approvedEntries;
  });
}

/* HOME EXPERIENCE PREVIEWS */

function renderHomeExperiences() {
  const container = document.getElementById("homeExperienceList");
  if (!container) return;

  container.innerHTML = "";

  const items = Object.entries(experiences).slice(0, 3);

  if (!items.length) {
    const empty = document.createElement("div");
    empty.className = "experience-preview-item";
    empty.textContent = "No approved fieldwork experiences yet.";
    container.appendChild(empty);
  } else {
    items.forEach(([id, item]) => {
      const button = document.createElement("button");
      button.className = "experience-preview-item";

      const title = document.createElement("span");
      title.textContent = item.title;

      const country = document.createElement("span");
      country.textContent = item.country;

      button.append(title, country);
      button.addEventListener("click", () => openExperience(id));
      container.appendChild(button);
    });
  }

  const add = document.createElement("button");
  add.className = "experience-add";
  add.textContent = "Add your experience +";
  add.addEventListener("click", () => goHomeSection("homeContribution"));
  container.appendChild(add);
}

/* VIEW NAVIGATION */

function goHomeSection(sectionId) {
  showView("homeView");

  setTimeout(() => {
    const section = document.getElementById(sectionId);
    if (section) section.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  }, 80);
}

function showView(viewId) {
  if (viewId === "contributeView") {
    goHomeSection("homeContribution");
    return;
  }

  if (viewId === "aboutView") {
    goHomeSection("homeAbout");
    return;
  }

  document.querySelectorAll(".view").forEach(view => {
    view.classList.remove("active");
  });

  document.getElementById(viewId).classList.add("active");
  window.scrollTo({ top: 0, behavior: "instant" });

  if (world) setTimeout(resizeGlobe, 100);
}

/* PROTOCOL TILES */

function makeProtocolTile(protocol) {
  const button = document.createElement("button");
  button.className = "protocol-tile";

  button.innerHTML = `
    <span class="eyebrow">${protocol.code || "ATLAS"}</span>
    <span class="tile-country"></span>
    <span class="tile-meta"></span>
  `;

  button.querySelector(".tile-country").textContent = protocol.country;
  button.querySelector(".tile-meta").textContent =
    (protocol.updated || "Protocol record") + " / Open country profile →";

  button.addEventListener("click", () => openCountry(protocol.id));
  return button;
}

function renderProtocolGrids() {
  const homeGrid = document.getElementById("homeProtocolGrid");
  const fullGrid = document.getElementById("fullProtocolGrid");

  if (!homeGrid || !fullGrid) return;

  homeGrid.innerHTML = "";
  fullGrid.innerHTML = "";

  protocols.slice(0, 14).forEach(protocol => {
    homeGrid.appendChild(makeProtocolTile(protocol));
    fullGrid.appendChild(makeProtocolTile(protocol));
  });

  const addTile = document.createElement("button");
  addTile.className = "protocol-tile add-tile";
  addTile.innerHTML = `
    <span>CONTRIBUTE</span>
    <span class="plus">+</span>
  `;
  addTile.addEventListener("click", () => goHomeSection("homeContribution"));

  homeGrid.appendChild(addTile.cloneNode(true));
  homeGrid.lastElementChild.addEventListener(
    "click",
    () => goHomeSection("homeContribution")
  );

  fullGrid.appendChild(addTile);
}

/* COUNTRY PROFILES */

function openCountry(countryId) {
  const protocol = protocols.find(item => item.id === countryId);
  if (!protocol) return;

  document.getElementById("countryTitle").textContent =
    protocol.title || protocol.country;

  document.getElementById("countryEyebrow").textContent =
    "Country protocol / " + (protocol.code || "Atlas");

  document.getElementById("countryStatus").textContent =
    protocol.status || "Information record";

  document.getElementById("countryOverview").textContent =
    protocol.overview || "No overview has been added yet.";

  document.getElementById("countryInstitutions").textContent =
    protocol.institutions || "No institutional information has been added yet.";

  document.getElementById("countryNotes").textContent =
    protocol.notes || "Check current requirements with the relevant authorities.";

  const steps = document.getElementById("countrySteps");
  steps.innerHTML = "";

  (protocol.steps || []).forEach(step => {
    const li = document.createElement("li");
    li.textContent = step;
    steps.appendChild(li);
  });

  document.getElementById("countryMapLabel").textContent = protocol.country;

  const list = document.getElementById("countryExperienceList");
  list.innerHTML = "";

  const matchingExperiences = Object.entries(experiences)
    .filter(([id, item]) => item.country.toLowerCase() === protocol.country.toLowerCase());

  if (!matchingExperiences.length) {
    list.innerHTML = '<div class="eyebrow">No experiences published yet.</div>';
  } else {
    matchingExperiences.forEach(([id, item]) => {
      const card = document.createElement("button");
      card.className = "experience-list-card";

      const title = document.createElement("strong");
      title.textContent = item.title;

      const description = document.createElement("span");
      description.textContent = "First-hand fieldwork account";

      card.append(title, description);
      card.addEventListener("click", () => openExperience(id));
      list.appendChild(card);
    });
  }

  showView("countryView");
  rotateGlobeToCountry(protocol.country);
}

/* EXPERIENCE MODAL */

function openExperience(id) {
  const entry = experiences[id];
  if (!entry) return;

  document.getElementById("modalCountry").textContent =
    entry.country + " / Fieldwork experience";

  document.getElementById("modalTitle").textContent = entry.title;
  document.getElementById("modalBody").textContent = entry.text;

  document.getElementById("experienceModal").classList.add("visible");
}

function closeExperience() {
  document.getElementById("experienceModal").classList.remove("visible");
}

function closeModalOutside(event) {
  if (event.target.id === "experienceModal") closeExperience();
}

/* CONTRIBUTION FORM */

document.getElementById("contributionForm").addEventListener("submit", event => {
  event.preventDefault();

  const form = event.currentTarget;
  const message = document.getElementById("formMessage");
  const submitButton = form.querySelector('button[type="submit"]');

  if (!form.reportValidity()) return;

  const submission = {
    type: document.getElementById("contributionType").value,
    country: document.getElementById("country").value.trim(),
    year: document.getElementById("researchYear").value,
    discipline: document.getElementById("discipline").value.trim(),
    researchType: document.getElementById("researchType").value.trim(),
    authority: document.getElementById("authority").value.trim(),
    duration: document.getElementById("permissionDuration").value.trim(),
    outcome: document.getElementById("permissionOutcome").value,
    cost: document.getElementById("permissionCost").value.trim(),
    protocolSummary: document.getElementById("protocolSummary").value.trim(),
    title: document.getElementById("title").value.trim(),
    summary: document.getElementById("summary").value.trim(),
    experience: document.getElementById("experience").value.trim(),
    advice: document.getElementById("advice").value.trim(),
    source: document.getElementById("source").value.trim(),
    name: document.getElementById("contributorName").value.trim(),
    email: document.getElementById("email").value.trim()
  };

  submitButton.disabled = true;
  message.textContent = "Sending your contribution…";

  const frameName = "atlasSubmissionFrame_" + Date.now();
  const iframe = document.createElement("iframe");
  iframe.name = frameName;
  iframe.title = "Submission response";
  iframe.src = "about:blank";
  iframe.style.display = "none";

  const postForm = document.createElement("form");
  postForm.method = "POST";
  postForm.action = ATLAS_API_URL;
  postForm.target = frameName;
  postForm.style.display = "none";

  const payload = document.createElement("input");
  payload.type = "hidden";
  payload.name = "payload";
  payload.value = JSON.stringify(submission);
  postForm.appendChild(payload);

  let completed = false;
  let submitted = false;
  let failureTimer;

  const finish = success => {
    if (completed) return;
    completed = true;
    clearTimeout(failureTimer);
    postForm.remove();
    iframe.remove();
    submitButton.disabled = false;

    if (success) {
      form.reset();
      message.textContent =
        "Thank you. Your contribution has been sent for review. It will only appear on the Atlas if it is approved.";
    } else {
      message.textContent =
        "We could not confirm that your contribution was sent. Please try again.";
    }
  };

  iframe.addEventListener("load", () => {
    if (!submitted) {
      submitted = true;
      postForm.submit();
      return;
    }
    finish(true);
  });

  document.body.appendChild(iframe);
  document.body.appendChild(postForm);

  failureTimer = setTimeout(() => finish(false), 20000);
});

/* GLOBE */

let world = null;
let countryFeatures = [];

function getCountryCentre(feature) {
  const coordinates = [];

  function collect(coords) {
    if (!Array.isArray(coords)) return;

    if (
      coords.length >= 2 &&
      typeof coords[0] === "number" &&
      typeof coords[1] === "number"
    ) {
      coordinates.push(coords);
    } else {
      coords.forEach(collect);
    }
  }

  collect(feature.geometry.coordinates);

  if (!coordinates.length) return { lat: 0, lng: 0 };

  let lng = 0;
  let lat = 0;

  coordinates.forEach(point => {
    lng += point[0];
    lat += point[1];
  });

  return {
    lat: lat / coordinates.length,
    lng: lng / coordinates.length
  };
}

function rotateGlobeToCountry(countryName) {
  const targetGlobe = window.countryWorld || world;
  if (!targetGlobe) return;

  const feature = countryFeatures.find(item =>
    item.properties.name.toLowerCase() === countryName.toLowerCase()
  );

  if (!feature) return;

  const centre = getCountryCentre(feature);

  targetGlobe.pointOfView({
    lat: centre.lat,
    lng: centre.lng,
    altitude: 1.45
  }, 1000);

  targetGlobe.polygonCapColor(featureItem => {
    return featureItem.properties.name === countryName
      ? "rgba(181,198,176,0.98)"
      : "#ffffff";
  });
}

function resizeGlobe() {
  const element = document.getElementById("globeViz");

  if (world && element && element.clientWidth && element.clientHeight) {
    world.width(element.clientWidth).height(element.clientHeight);
  }

  const countryElement = document.getElementById("countryGlobeViz");

  if (
    window.countryWorld &&
    countryElement &&
    countryElement.clientWidth &&
    countryElement.clientHeight
  ) {
    window.countryWorld
      .width(countryElement.clientWidth)
      .height(countryElement.clientHeight);
  }
}

window.addEventListener("load", async () => {
  const globeElement = document.getElementById("globeViz");

  world = Globe()(globeElement)
    .width(globeElement.clientWidth)
    .height(globeElement.clientHeight)
    .backgroundColor("rgba(255,255,255,0)")
    .showGlobe(true)
    .globeMaterial(new THREE.MeshPhongMaterial({
      color: "#DCEAF2",
      shininess: 0
    }))
    .showAtmosphere(false)
    .showGraticules(false)
    .enablePointerInteraction(true)
    .polygonAltitude(0.006)
    .polygonCapColor(feature => {
      return feature.properties.name === "Malawi"
        ? "rgba(181,198,176,0.98)"
        : "#ffffff";
    })
    .polygonSideColor(() => "rgba(255,255,255,0)")
    .polygonStrokeColor(() => "#DCEAF2")
    .polygonLabel(feature => feature.properties.name)
    .onPolygonClick(feature => {
      const countryName = feature.properties.name;

      const match = protocols.find(item =>
        item.country.toLowerCase() === countryName.toLowerCase()
      );

      if (match) {
        openCountry(match.id);
      } else {
        createCountryProfile(countryName);
      }
    });

  try {
    const response = await fetch(
      "https://unpkg.com/world-atlas@2/countries-110m.json"
    );

    if (!response.ok) throw new Error("Country data unavailable");

    const worldData = await response.json();

    countryFeatures = topojson.feature(
      worldData,
      worldData.objects.countries
    ).features;

    world.polygonsData(countryFeatures);

    world.pointOfView({
      lat: -3,
      lng: 20,
      altitude: 1.65
    });

    const controls = world.controls();
    if (controls) controls.enableZoom = false;

    const countryElement = document.getElementById("countryGlobeViz");

    if (countryElement) {
      window.countryWorld = Globe()(countryElement)
        .width(countryElement.clientWidth)
        .height(countryElement.clientHeight)
        .backgroundColor("rgba(255,255,255,0)")
        .showGlobe(true)
        .globeMaterial(new THREE.MeshPhongMaterial({
          color: "#DCEAF2",
          shininess: 0
        }))
        .showAtmosphere(false)
        .showGraticules(false)
        .polygonAltitude(0.006)
        .polygonCapColor(feature =>
          feature.properties.name === "Malawi"
            ? "rgba(181,198,176,0.98)"
            : "#ffffff"
        )
        .polygonSideColor(() => "rgba(255,255,255,0)")
        .polygonStrokeColor(() => "#DCEAF2")
        .polygonLabel(feature => feature.properties.name);

      window.countryWorld.polygonsData(countryFeatures);

      const countryControls = window.countryWorld.controls();
      if (countryControls) countryControls.enableZoom = false;
    }
  } catch (error) {
    console.error("Could not load country data:", error);
  }

  renderProtocolGrids();
  renderHomeExperiences();

  refreshAtlasFromSheet().catch(error => {
    console.error("Could not load approved Atlas contributions:", error);

    const message = document.getElementById("homeExperienceList");
    if (message && !Object.keys(experiences).length) {
      message.innerHTML =
        '<div class="experience-preview-item">Approved contributions are temporarily unavailable.</div>';
    }
  });

  setInterval(() => {
    refreshAtlasFromSheet().catch(error =>
      console.warn("Atlas refresh failed:", error)
    );
  }, 60000);

  window.addEventListener("resize", resizeGlobe);
});

/* COUNTRY WITHOUT A PROTOCOL RECORD */

function createCountryProfile(countryName) {
  const existing = protocols.find(item =>
    item.country.toLowerCase() === countryName.toLowerCase()
  );

  if (existing) {
    openCountry(existing.id);
    return;
  }

  document.getElementById("countryTitle").textContent =
    countryName + " / Protocol profile";

  document.getElementById("countryEyebrow").textContent =
    "Country profile / No published protocol";

  document.getElementById("countryStatus").textContent =
    "Awaiting contribution";

  document.getElementById("countryOverview").textContent =
    "There is not yet a published research protocol for " +
    countryName +
    ". This profile can be developed through contributions from researchers who have undertaken research here.";

  document.getElementById("countrySteps").innerHTML =
    "<li>No verified steps have been added yet.</li>";

  document.getElementById("countryInstitutions").textContent =
    "Institutional information has not yet been contributed or reviewed.";

  document.getElementById("countryNotes").textContent =
    "Do not treat this empty profile as an indication that no permissions are required. Check with the relevant authorities.";

  document.getElementById("countryMapLabel").textContent = countryName;

  document.getElementById("countryExperienceList").innerHTML =
    '<div class="eyebrow">No experiences published yet.</div>';

  showView("countryView");
  rotateGlobeToCountry(countryName);
}
</script>
