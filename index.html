/* =========================================================
   DATA CONNECTION
   ========================================================= */

const ATLAS_API_URL =
  "https://script.google.com/macros/s/AKfycbzA6dHoFuk9T_5RWgQ-BnmCOFZ5H2LSgwHWXTVb8PGWz0xx9Mg2QbupJ3_2FeXFfqB7zQ/exec";

let atlasEntries = [];
let countryProfiles = {};
let globeInstance = null;
let countryFeatures = [];
let allProtocolsExpanded = false;


/* =========================================================
   CONTRIBUTION FORM OPEN / CLOSE
   ========================================================= */

function toggleContributionForm() {
  const section = document.getElementById("contribute");

  if (section.classList.contains("open")) {
    closeContributionForm();
  } else {
    openContributionForm();
  }
}

function openContributionForm() {
  const section = document.getElementById("contribute");
  const button = document.getElementById("contributeButton");
  const frame = document.getElementById("contributionFormFrame");

  section.classList.add("open");
  button.setAttribute("aria-expanded", "true");

  /* Load the Google Form only when someone opens it. */
  if (!frame.getAttribute("src")) {
    frame.setAttribute("src", frame.dataset.src);
  }

  section.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });
}

function closeContributionForm() {
  const section = document.getElementById("contribute");
  const button = document.getElementById("contributeButton");

  section.classList.remove("open");
  button.setAttribute("aria-expanded", "false");
}


/* =========================================================
   COUNTRY NAME MATCHING
   ========================================================= */

const countryAliases = {
  "united states of america":"united states",
  "usa":"united states",
  "uk":"united kingdom",
  "russian federation":"russia",
  "viet nam":"vietnam",
  "turkey":"turkiye",
  "türkiye":"turkiye",
  "iran, islamic republic of":"iran",
  "iran (islamic republic of)":"iran",
  "syrian arab republic":"syria",
  "lao people's democratic republic":"laos",
  "laos (lao people's democratic republic)":"laos",
  "republic of korea":"south korea",
  "korea, republic of":"south korea",
  "democratic people's republic of korea":"north korea",
  "korea, democratic people's republic of":"north korea",
  "congo, the democratic republic of the":"democratic republic of the congo",
  "democratic republic of congo":"democratic republic of the congo",
  "congo":"republic of the congo",
  "czech republic":"czechia",
  "swaziland":"eswatini",
  "the gambia":"gambia",
  "cape verde":"cabo verde",
  "ivory coast":"cote d'ivoire",
  "côte d’ivoire":"cote d'ivoire",
  "côte d'ivoire":"cote d'ivoire",
  "brunei darussalam":"brunei",
  "moldova, republic of":"moldova",
  "republic of moldova":"moldova",
  "tanzania, united republic of":"tanzania",
  "united republic of tanzania":"tanzania",
  "bolivia, plurinational state of":"bolivia",
  "venezuela, bolivarian republic of":"venezuela",
  "palestine, state of":"palestine",
  "state of palestine":"palestine",
  "holy see":"vatican city",
  "vatican city state":"vatican city"
};

function normaliseCountryName(name) {
  const cleaned = String(name || "")
    .trim()
    .toLowerCase()
    .replace(/[’]/g, "'")
    .replace(/\s+/g, " ");

  return countryAliases[cleaned] || cleaned;
}


/* =========================================================
   SAFE DISPLAY HELPERS
   ========================================================= */

function valueOf(entry, key) {
  const value = entry && entry[key];

  if (value === null || value === undefined) return "";

  return String(value).trim();
}

function uniqueValues(values) {
  const seen = new Set();

  return values
    .map(value => String(value || "").trim())
    .filter(value => {
      if (!value) return false;

      const key = value.toLowerCase();

      if (seen.has(key)) return false;

      seen.add(key);
      return true;
    });
}

function makeElement(tag, className, text) {
  const element = document.createElement(tag);

  if (className) element.className = className;

  if (text !== undefined && text !== null) {
    element.textContent = text;
  }

  return element;
}

function formatYear(year) {
  return year || "Year not specified";
}

function getEntryTitle(entry) {
  return valueOf(entry, "title") ||
    ("Research in " + valueOf(entry, "country"));
}

function getEntryCategory(entry) {
  return valueOf(entry, "researchCategory") ||
    "Research area not specified";
}

function getSortedEntries(entries) {
  return [...entries].sort((a, b) => {
    const dateA = Date.parse(valueOf(a, "submittedAt")) || 0;
    const dateB = Date.parse(valueOf(b, "submittedAt")) || 0;

    if (dateA && dateB) return dateB - dateA;
    if (dateA) return -1;
    if (dateB) return 1;

    return (Number(valueOf(b, "applicationYear")) || 0) -
      (Number(valueOf(a, "applicationYear")) || 0);
  });
}

function latestEntry(entries) {
  return getSortedEntries(entries)[0] || null;
}


/* =========================================================
   BUILD COUNTRY PROFILES
   ========================================================= */

function buildCountryProfiles(entries) {
  const grouped = {};

  entries.forEach(entry => {
    const country = valueOf(entry, "country");
    if (!country) return;

    const key = normaliseCountryName(country);

    if (!grouped[key]) {
      grouped[key] = {
        country: country,
        entries: []
      };
    }

    grouped[key].entries.push(entry);
  });

  countryProfiles = grouped;
}


/* =========================================================
   LOAD PUBLISHED ENTRIES
   ========================================================= */

function loadAtlasData() {
  fetch(ATLAS_API_URL, {
    method: "GET",
    redirect: "follow",
    cache: "no-store"
  })
  .then(response => {
    if (!response.ok) {
      throw new Error("Atlas feed returned an HTTP error");
    }

    return response.json();
  })
  .then(data => {
    if (Array.isArray(data)) return data;

    if (data && Array.isArray(data.entries)) {
      return data.entries;
    }

    if (data && data.success === false) {
      throw new Error(data.message || "Atlas feed reported an error");
    }

    return [];
  })
  .catch(error => {
    console.warn("Standard feed request failed; trying JSONP.", error);
    return loadAtlasDataJsonp();
  })
  .then(entries => {
    atlasEntries = Array.isArray(entries) ? entries : [];

    buildCountryProfiles(atlasEntries);
    renderAllCountryProtocols();
    updateGlobeColours();

    console.log(
      "Fieldwork Atlas:",
      atlasEntries.length,
      "published contributions across",
      Object.keys(countryProfiles).length,
      "countries."
    );
  })
  .catch(error => {
    console.error("Could not load Atlas contributions:", error);

    atlasEntries = [];
    countryProfiles = {};

    renderAllCountryProtocols();
    updateGlobeColours();
  });
}

function loadAtlasDataJsonp() {
  return new Promise((resolve, reject) => {
    const callbackName =
      "atlasJsonpCallback_" + Date.now() + "_" +
      Math.floor(Math.random() * 100000);

    const script = document.createElement("script");

    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error("Atlas feed request timed out"));
    }, 12000);

    function cleanup() {
      clearTimeout(timeout);
      script.remove();

      try {
        delete window[callbackName];
      } catch (error) {
        window[callbackName] = undefined;
      }
    }

    window[callbackName] = data => {
      cleanup();

      if (Array.isArray(data)) {
        resolve(data);
      } else if (data && Array.isArray(data.entries)) {
        resolve(data.entries);
      } else {
        resolve([]);
      }
    };

    script.onerror = () => {
      cleanup();
      reject(new Error("Could not load Atlas JSONP feed"));
    };

    script.src =
      ATLAS_API_URL +
      (ATLAS_API_URL.includes("?") ? "&" : "?") +
      "callback=" + encodeURIComponent(callbackName);

    document.head.appendChild(script);
  });
}


/* =========================================================
   HOMEPAGE CONTRIBUTIONS
   Latest four shown first; button reveals the full list.
   ========================================================= */

function createProtocolCard(entry) {
  const card = makeElement("button", "protocol-card");
  card.type = "button";

  const top = makeElement("div");

  top.appendChild(
    makeElement("div", "protocol-country", valueOf(entry, "country"))
  );

  top.appendChild(
    makeElement("h3", "", getEntryTitle(entry))
  );

  const meta = [
    formatYear(valueOf(entry, "applicationYear")),
    getEntryCategory(entry)
  ].filter(Boolean).join(" · ");

  card.append(
    top,
    makeElement("div", "protocol-meta", meta)
  );

  card.addEventListener("click", () => openExperience(entry));

  return card;
}

function renderAllCountryProtocols() {
  const container = document.getElementById("allCountryProtocols");
  const viewButton = document.getElementById("viewAllProtocols");

  container.replaceChildren();

  const entries = getSortedEntries(atlasEntries);

  if (!entries.length) {
    container.appendChild(
      makeElement(
        "div",
        "empty-state",
        "Published contributions will appear here as they are added to the Atlas."
      )
    );

    viewButton.hidden = true;
    return;
  }

  entries.forEach((entry, index) => {
    const card = createProtocolCard(entry);

    if (!allProtocolsExpanded && index >= 4) {
      card.hidden = true;
    }

    container.appendChild(card);
  });

  viewButton.hidden = entries.length <= 4;
  updateViewAllButton();
}

function toggleAllProtocols() {
  allProtocolsExpanded = !allProtocolsExpanded;

  const cards = document.querySelectorAll(
    "#allCountryProtocols .protocol-card"
  );

  cards.forEach((card, index) => {
    card.hidden = !allProtocolsExpanded && index >= 4;
  });

  updateViewAllButton();
}

function updateViewAllButton() {
  const button = document.getElementById("viewAllProtocols");

  if (button.hidden) return;

  button.textContent = allProtocolsExpanded
    ? "Show fewer research protocols ↑"
    : "View all research protocols →";
}


/* =========================================================
   COUNTRY PROFILE
   ========================================================= */

function openProfile(countryName) {
  const panel = document.getElementById("countryProfile");
  const key = normaliseCountryName(countryName);
  const profile = countryProfiles[key];

  const entries = profile && Array.isArray(profile.entries)
    ? getSortedEntries(profile.entries)
    : [];

  const displayName = profile ? profile.country : countryName;

  document.getElementById("profileTitle").textContent = displayName;

  const status = document.getElementById("profileStatus");

  status.textContent = entries.length
    ? entries.length + (entries.length === 1
      ? " published contribution"
      : " published contributions")
    : "No published contributions yet";

  status.classList.toggle("empty", !entries.length);

  document.getElementById("profileText").textContent = entries.length
    ? "This profile brings together published researcher contributions about applying for research permission and conducting research in " +
      displayName +
      ". Each research area summarises the experiences shared by contributors. Timeframes and costs are based on the most recently submitted account in that area, and should not be taken as typical or guaranteed figures. Requirements may vary by institution, research type and year."
    : "There is not yet a published profile for " +
      displayName +
      ". If you have applied for research permission or conducted research here, you can contribute your experience to help build this country profile.";

  renderResearchAreaCards(entries);
  renderProfileEntries(entries);

  panel.style.display = "block";

  panel.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

function closeProfile() {
  document.getElementById("countryProfile").style.display = "none";
}


/* =========================================================
   RESEARCH AREA SUMMARY TILES
   ========================================================= */

function addCategorySummaryBlock(container, heading, values) {
  const items = uniqueValues(values);

  if (!items.length) return;

  const block = makeElement("div", "category-summary-block");
  block.appendChild(makeElement("h5", "", heading));

  const list = makeElement("ul");

  items.forEach(item => {
    list.appendChild(makeElement("li", "", item));
  });

  block.appendChild(list);
  container.appendChild(block);
}

function renderResearchAreaCards(entries) {
  const container = document.getElementById("profileCategories");
  container.replaceChildren();

  if (!entries.length) {
    container.appendChild(
      makeElement(
        "div",
        "profile-empty",
        "There is no published research-area information for this country yet."
      )
    );

    return;
  }

  const grouped = {};

  entries.forEach(entry => {
    const category = getEntryCategory(entry);

    if (!grouped[category]) {
      grouped[category] = [];
    }

    grouped[category].push(entry);
  });

  const section = makeElement("div", "profile-section");
  section.appendChild(
    makeElement("h3", "", "Research area profiles")
  );

  const grid = makeElement("div", "category-grid");

  Object.keys(grouped).sort().forEach(category => {
    const areaEntries = getSortedEntries(grouped[category]);
    const latest = latestEntry(areaEntries);

    const card = makeElement("article", "category-card");

    card.appendChild(makeElement("h4", "", category));

    card.appendChild(
      makeElement(
        "div",
        "category-count",
        areaEntries.length +
          (areaEntries.length === 1 ? " contribution" : " contributions")
      )
    );

    /* Time and cost figures */

    const figures = makeElement("div", "category-figures");

    const time = makeElement("div", "category-figure");

    time.append(
      makeElement("span", "", "Time taken"),
      makeElement(
        "strong",
        "",
        valueOf(latest, "duration") || "Not reported"
      )
    );

    const cost = makeElement("div", "category-figure");

    const costText = [
      valueOf(latest, "costs"),
      valueOf(latest, "costDetails")
    ].filter(Boolean).join(" — ");

    cost.append(
      makeElement("span", "", "Fees / costs"),
      makeElement("strong", "", costText || "Not reported")
    );

    figures.append(time, cost);
    card.appendChild(figures);

    card.appendChild(
      makeElement(
        "div",
        "category-latest-note",
        "Time and cost figures are from the most recently submitted account in this research area. They are not necessarily typical or guaranteed."
      )
    );

    addCategorySummaryBlock(
      card,
      "Researcher classifications",
      areaEntries.map(entry =>
        valueOf(entry, "researcherClassification")
      )
    );

    addCategorySummaryBlock(
      card,
      "Permission authorities and institutions",
      areaEntries.map(entry =>
        [
          valueOf(entry, "authorities"),
          valueOf(entry, "authorityNames")
        ].filter(Boolean).join(": ")
      )
    );

    addCategorySummaryBlock(
      card,
      "Local partners and affiliations",
      areaEntries.map(entry =>
        [
          valueOf(entry, "localPartner"),
          valueOf(entry, "localAffiliation")
        ].filter(Boolean).join(" · ")
      )
    );

    addCategorySummaryBlock(
      card,
      "Application outcomes",
      areaEntries.map(entry => valueOf(entry, "outcome"))
    );

    addCategorySummaryBlock(
      card,
      "Challenges and delays",
      areaEntries.map(entry => valueOf(entry, "challenges"))
    );

    addCategorySummaryBlock(
      card,
      "Advice for future researchers",
      areaEntries.flatMap(entry => [
        valueOf(entry, "wishKnown"),
        valueOf(entry, "advice")
      ])
    );

    addCategorySummaryBlock(
      card,
      "Useful resources",
      areaEntries.map(entry => valueOf(entry, "resources"))
    );

    grid.appendChild(card);
  });

  section.appendChild(grid);
  container.appendChild(section);
}


/* =========================================================
   INDIVIDUAL CONTRIBUTION TILES
   ========================================================= */

function createProfileEntry(entry) {
  const card = makeElement("article", "profile-entry");

  card.appendChild(
    makeElement("h4", "", getEntryTitle(entry))
  );

  const meta = [
    formatYear(valueOf(entry, "applicationYear")),
    getEntryCategory(entry),
    valueOf(entry, "researchStatus")
  ].filter(Boolean).join(" · ");

  card.appendChild(
    makeElement("div", "profile-entry-meta", meta)
  );

  const duration = valueOf(entry, "duration");

  const cost = [
    valueOf(entry, "costs"),
    valueOf(entry, "costDetails")
  ].filter(Boolean).join(" — ");

  const outcome = valueOf(entry, "outcome");

  if (duration) {
    card.appendChild(
      makeElement("p", "", "Time taken: " + duration)
    );
  }

  if (cost) {
    card.appendChild(
      makeElement("p", "", "Fees / costs: " + cost)
    );
  }

  if (outcome) {
    card.appendChild(
      makeElement("p", "", "Outcome: " + outcome)
    );
  }

  const button = makeElement(
    "button",
    "read-more",
    "Read full contribution →"
  );

  button.type = "button";
  button.addEventListener("click", () => openExperience(entry));

  card.appendChild(button);

  return card;
}

function renderProfileEntries(entries) {
  const container = document.getElementById("profileExperiences");
  container.replaceChildren();

  if (!entries.length) {
    container.appendChild(
      makeElement(
        "div",
        "profile-empty",
        "There are no published researcher contributions for this country yet."
      )
    );

    return;
  }

  getSortedEntries(entries).forEach(entry => {
    container.appendChild(createProfileEntry(entry));
  });
}


/* =========================================================
   FULL CONTRIBUTION MODAL
   ========================================================= */

function openExperience(entry) {
  if (!entry) return;

  document.getElementById("modalCountry").textContent =
    valueOf(entry, "country");

  document.getElementById("modalTitle").textContent =
    getEntryTitle(entry);

  document.getElementById("modalMeta").textContent = [
    formatYear(valueOf(entry, "applicationYear")),
    getEntryCategory(entry),
    valueOf(entry, "researchStatus")
  ].filter(Boolean).join(" · ");

  const body = document.getElementById("modalBody");
  body.replaceChildren();

  const sections = [
    ["Research background", [
      ["Research category", "researchCategory"],
      ["Specific discipline", "discipline"],
      ["Type of research", "researchType"],
      ["Research status", "researchStatus"],
      ["Researcher classification", "researcherClassification"],
      ["Local institutional affiliation", "localAffiliation"]
    ]],
    ["Permission process", [
      ["Authorities involved", "authorities"],
      ["Institutions named", "authorityNames"],
      ["Local partner or sponsor", "localPartner"]
    ]],
    ["Time and costs", [
      ["Time taken", "duration"],
      ["Stages of the process", "stageTimings"],
      ["Fees or costs", "costs"],
      ["Cost details", "costDetails"]
    ]],
    ["Outcome and experience", [
      ["Application outcome", "outcome"],
      ["Biggest challenge or delay", "challenges"]
    ]],
    ["Advice for future researchers", [
      ["What I wish I had known", "wishKnown"],
      ["Advice", "advice"],
      ["Useful resources", "resources"]
    ]]
  ];

  sections.forEach(([heading, fields]) => {
    const populated = fields.filter(([, key]) => valueOf(entry, key));

    if (!populated.length) return;

    const section = makeElement("div", "profile-section");

    section.appendChild(makeElement("h3", "", heading));

    populated.forEach(([label, key]) => {
      const paragraph = makeElement("p");

      const strong = makeElement("strong", "", label + ": ");

      paragraph.append(
        strong,
        document.createTextNode(valueOf(entry, key))
      );

      section.appendChild(paragraph);
    });

    body.appendChild(section);
  });

  document.getElementById("experienceModal").classList.add("visible");
}

function closeExperience() {
  document.getElementById("experienceModal").classList.remove("visible");
}

function closeModalOutside(event) {
  if (event.target.id === "experienceModal") {
    closeExperience();
  }
}

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeExperience();
    closeProfile();

    const form = document.getElementById("contribute");
    if (form.classList.contains("open")) {
      closeContributionForm();
    }
  }
});


/* =========================================================
   GLOBE COLOURS
   ========================================================= */

function updateGlobeColours() {
  if (!globeInstance) return;

  globeInstance.polygonCapColor(feature => {
    const name = feature.properties && feature.properties.name;

    return countryProfiles[normaliseCountryName(name)]
      ? "#4285f4"
      : "#e8eaed";
  });

  globeInstance.polygonAltitude(feature => {
    const name = feature.properties && feature.properties.name;

    return countryProfiles[normaliseCountryName(name)]
      ? 0.014
      : 0.008;
  });
}


/* =========================================================
   LOAD GLOBE LIBRARIES AFTER THE MAIN PAGE HAS RENDERED
   ========================================================= */

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const script = document.createElement("script");

    script.src = src;
    script.async = true;

    script.onload = resolve;

    script.onerror = () => {
      reject(new Error("Could not load " + src));
    };

    document.head.appendChild(script);
  });
}

async function initialiseGlobe() {
  if (globeInstance) return;

  const globeElement = document.getElementById("globeViz");
  const placeholder = document.getElementById("globePlaceholder");

  try {
    await loadScript(
      "https://unpkg.com/three@0.160.0/build/three.min.js"
    );

    await loadScript(
      "https://unpkg.com/globe.gl@2.45.0/dist/globe.gl.min.js"
    );

    await loadScript(
      "https://unpkg.com/topojson-client@3"
    );

    if (
      typeof Globe === "undefined" ||
      typeof THREE === "undefined" ||
      typeof topojson === "undefined"
    ) {
      throw new Error("Globe libraries are unavailable.");
    }

    const world = Globe()(globeElement)
      .width(globeElement.clientWidth)
      .height(globeElement.clientHeight)
      .backgroundColor("rgba(255,255,255,0)")
      .showGlobe(true)
      .globeMaterial(
        new THREE.MeshPhongMaterial({
          color:0xeaf2ff,
          shininess:0
        })
      )
      .showAtmosphere(false)
      .showGraticules(false)
      .polygonAltitude(0.008)
      .polygonCapColor(() => "#e8eaed")
      .polygonSideColor(() => "rgba(0,0,0,0)")
      .polygonStrokeColor(() => "#FFFFFF")
      .polygonLabel(feature => feature.properties.name)
      .onPolygonClick(feature => {
        const countryName =
          feature.properties && feature.properties.name;

        if (countryName) {
          openProfile(countryName);
        }
      });

    globeInstance = world;

    if (world.renderer) {
      const renderer = world.renderer();

      renderer.setPixelRatio(
        Math.min(window.devicePixelRatio || 1, 1.1)
      );
    }

    world.controls().enableDamping = true;
    world.controls().dampingFactor = 0.08;

    const response = await fetch(
      "https://unpkg.com/world-atlas@2/countries-110m.json"
    );

    if (!response.ok) {
      throw new Error("Could not load country map data.");
    }

    const worldData = await response.json();

    countryFeatures = topojson.feature(
      worldData,
      worldData.objects.countries
    ).features;

    world.polygonsData(countryFeatures);

    world.pointOfView({
      lat:-3,
      lng:20,
      altitude:2.2
    });

    updateGlobeColours();

    if (placeholder) {
      placeholder.style.display = "none";
    }

  } catch (error) {
    console.error("Globe could not be initialised:", error);

    if (placeholder) {
      placeholder.textContent =
        "The interactive globe could not load. Contributions are still available below.";
    }
  }

  window.addEventListener("resize", () => {
    if (globeInstance) {
      globeInstance
        .width(globeElement.clientWidth)
        .height(globeElement.clientHeight);
    }
  });
}


/* =========================================================
   START THE PAGE
   ========================================================= */

document.addEventListener("DOMContentLoaded", () => {
  loadAtlasData();

  const startGlobe = () => initialiseGlobe();

  if ("requestIdleCallback" in window) {
    requestIdleCallback(startGlobe, {timeout:2500});
  } else {
    setTimeout(startGlobe, 900);
  }
});
