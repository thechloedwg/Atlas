
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Protocols | Fieldwork Atlas</title>
<meta name="description" content="Explore published research permission experiences from around the world.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#3c4043;
  --blue:#4285f4;
  --muted:#70757a;
  --line:#dadce0;
  --soft:#f8fafd;
}

*{box-sizing:border-box}
body{
  margin:0;
  padding:30px;
  color:var(--ink);
  background:white;
  font-family:'Amiri',serif;
}

.page{
  max-width:1250px;
  margin:auto;
}

.topline{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  border-bottom:1px solid var(--line);
  padding-bottom:15px;
  margin-bottom:25px;
}

.back-link{
  color:var(--blue);
  font-size:14px;
}

h1{
  font-size:34px;
  font-weight:normal;
  margin:0 0 5px;
}

.intro{
  color:var(--muted);
  font-size:14px;
  line-height:1.6;
  margin-bottom:25px;
}

.results-line{
  color:var(--muted);
  font-size:12px;
  margin-bottom:12px;
}

.protocol-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}

.protocol-card{
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  min-width:0;
  min-height:140px;
  padding:15px;
  border:1px solid var(--line);
  background:white;
  color:var(--ink);
  text-align:left;
  cursor:pointer;
  transition:.2s;
}

.protocol-card:hover{
  border-color:var(--blue);
  background:#f8faff;
  transform:translateY(-2px);
}

.protocol-country{
  color:var(--blue);
  font-size:12px;
  margin-bottom:8px;
}

.protocol-card h2{
  font-size:20px;
  font-weight:normal;
  line-height:1.3;
  margin:0 0 12px;
  overflow-wrap:anywhere;
}

.protocol-meta{
  color:var(--muted);
  font-size:12px;
  line-height:1.4;
  margin-top:auto;
}

.empty-state{
  padding:25px;
  border:1px dashed var(--line);
  color:var(--muted);
  text-align:center;
  grid-column:1/-1;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:5;
  padding:20px;
  background:rgba(32,33,36,.55);
  align-items:center;
  justify-content:center;
  overflow-y:auto;
}

.modal.visible{display:flex}

.modal-content{
  position:relative;
  width:100%;
  max-width:720px;
  max-height:90vh;
  overflow-y:auto;
  background:white;
  padding:35px;
}

.modal-close{
  position:absolute;
  right:15px;
  top:10px;
  border:0;
  background:none;
  font-size:28px;
  cursor:pointer;
}

.modal-country{
  color:var(--blue);
  font-size:13px;
}

.modal-content h2{
  font-size:30px;
  font-weight:normal;
  margin:10px 0;
}

.modal-meta{
  color:var(--muted);
  font-size:12px;
  margin-bottom:20px;
}

.modal-section{
  border-top:1px solid var(--line);
  padding-top:14px;
  margin-top:18px;
}

.modal-section h3{
  font-size:21px;
  font-weight:normal;
  margin:0 0 10px;
}

.modal-section p{
  font-size:14px;
  line-height:1.7;
  color:#5f6368;
  white-space:pre-line;
  text-align:justify;
}

footer{
  border-top:1px solid var(--line);
  margin-top:35px;
  padding-top:12px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}

@media(max-width:850px){
  .protocol-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media(max-width:550px){
  body{padding:18px}
  .topline{align-items:flex-start}
  h1{font-size:27px}
  .protocol-grid{grid-template-columns:1fr}
  .protocol-card{min-height:110px}
  .modal-content{padding:28px 20px}
}
</style>
</head>

<body>
<main class="page">

  <div class="topline">
    <div>
      <h1>Research Protocols</h1>
      <div class="intro">Published research permission experiences from around the world.</div>
    </div>
    <a class="back-link" href="index.html">← Back to the Atlas</a>
  </div>

  <div class="results-line" id="resultsCount">Loading published contributions…</div>

  <div class="protocol-grid" id="protocolGrid">
    <div class="empty-state">Loading research experiences…</div>
  </div>

  <footer>Fieldwork Atlas · A collaborative research resource</footer>
</main>

<div class="modal" id="experienceModal" onclick="closeModalOutside(event)" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-content">
    <button class="modal-close" onclick="closeExperience()" aria-label="Close contribution">×</button>
    <div class="modal-country" id="modalCountry"></div>
    <h2 id="modalTitle"></h2>
    <div class="modal-meta" id="modalMeta"></div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const ATLAS_API_URL =
"https://script.google.com/macros/s/AKfycbzA6dHoFuk9T_5RWgQ-BnmCOFZ5H2LSgwHWXTVb8PGWz0xx9Mg2QbupJ3_2FeXFfqB7zQ/exec";

let entries=[];

function valueOf(entry,key){
  const value=entry && entry[key];
  return value===null || value===undefined ? "" : String(value).trim();
}

function makeElement(tag,className,text){
  const element=document.createElement(tag);
  if(className) element.className=className;
  if(text!==undefined && text!==null) element.textContent=text;
  return element;
}

function getTitle(entry){
  return valueOf(entry,"title") || ("Research in "+valueOf(entry,"country"));
}

function getCategory(entry){
  return valueOf(entry,"researchCategory") || "Research area not specified";
}

function getSortedEntries(list){
  return [...list].sort((a,b)=>{
    const da=Date.parse(valueOf(a,"submittedAt"))||0;
    const db=Date.parse(valueOf(b,"submittedAt"))||0;
    if(da && db) return db-da;
    if(da) return -1;
    if(db) return 1;
    return (Number(valueOf(b,"applicationYear"))||0) -
           (Number(valueOf(a,"applicationYear"))||0);
  });
}

function createCard(entry){
  const card=makeElement("button","protocol-card");
  card.type="button";

  card.appendChild(makeElement("div","protocol-country",valueOf(entry,"country")));
  card.appendChild(makeElement("h2","",getTitle(entry)));

  const meta=[
    valueOf(entry,"applicationYear") || "Year not specified",
    getCategory(entry),
    valueOf(entry,"researchStatus")
  ].filter(Boolean).join(" · ");

  card.appendChild(makeElement("div","protocol-meta",meta));
  card.addEventListener("click",()=>openExperience(entry));

  return card;
}

function renderEntries(){
  const grid=document.getElementById("protocolGrid");
  grid.replaceChildren();

  const sorted=getSortedEntries(entries);

  document.getElementById("resultsCount").textContent=
    sorted.length+(sorted.length===1
      ?" published contribution"
      :" published contributions");

  if(!sorted.length){
    grid.appendChild(makeElement("div","empty-state",
      "No published research contributions are available yet."));
    return;
  }

  sorted.forEach(entry=>grid.appendChild(createCard(entry)));
}

function openExperience(entry){
  document.getElementById("modalCountry").textContent=valueOf(entry,"country");
  document.getElementById("modalTitle").textContent=getTitle(entry);

  document.getElementById("modalMeta").textContent=[
    valueOf(entry,"applicationYear") || "Year not specified",
    getCategory(entry),
    valueOf(entry,"researchStatus")
  ].filter(Boolean).join(" · ");

  const body=document.getElementById("modalBody");
  body.replaceChildren();

  const sections=[
    ["Research background",[
      ["Research category","researchCategory"],
      ["Specific discipline","discipline"],
      ["Type of research","researchType"],
      ["Research status","researchStatus"],
      ["Researcher classification","researcherClassification"],
      ["Local institutional affiliation","localAffiliation"]
    ]],
    ["Permission process",[
      ["Authorities involved","authorities"],
      ["Institutions named","authorityNames"],
      ["Local partner or sponsor","localPartner"]
    ]],
    ["Time and costs",[
      ["Time taken","duration"],
      ["Stages of the process","stageTimings"],
      ["Fees or costs","costs"],
      ["Cost details","costDetails"]
    ]],
    ["Outcome and experience",[
      ["Application outcome","outcome"],
      ["Biggest challenge or delay","challenges"]
    ]],
    ["Advice for future researchers",[
      ["What I wish I had known","wishKnown"],
      ["Advice","advice"],
      ["Useful resources","resources"]
    ]]
  ];

  sections.forEach(([heading,fields])=>{
    const populated=fields.filter(([,key])=>valueOf(entry,key));
    if(!populated.length) return;

    const section=makeElement("section","modal-section");
    section.appendChild(makeElement("h3","",heading));

    populated.forEach(([label,key])=>{
      const p=makeElement("p");
      const strong=makeElement("strong","",label+": ");
      p.append(strong,document.createTextNode(valueOf(entry,key)));
      section.appendChild(p);
    });

    body.appendChild(section);
  });

  document.getElementById("experienceModal").classList.add("visible");
}

function closeExperience(){
  document.getElementById("experienceModal").classList.remove("visible");
}

function closeModalOutside(event){
  if(event.target.id==="experienceModal") closeExperience();
}

document.addEventListener("keydown",event=>{
  if(event.key==="Escape") closeExperience();
});

function loadJsonp(){
  return new Promise((resolve,reject)=>{
    const callbackName="atlasJsonp_"+Date.now();
    const script=document.createElement("script");

    const timeout=setTimeout(()=>{
      cleanup();
      reject(new Error("Feed request timed out"));
    },12000);

    function cleanup(){
      clearTimeout(timeout);
      script.remove();
      try{delete window[callbackName]}catch(e){window[callbackName]=undefined}
    }

    window[callbackName]=data=>{
      cleanup();
      if(Array.isArray(data)) resolve(data);
      else if(data && Array.isArray(data.entries)) resolve(data.entries);
      else resolve([]);
    };

    script.onerror=()=>{
      cleanup();
      reject(new Error("Could not load feed"));
    };

    script.src=ATLAS_API_URL+
      (ATLAS_API_URL.includes("?")?"&":"?")+
      "callback="+encodeURIComponent(callbackName);

    document.head.appendChild(script);
  });
}

fetch(ATLAS_API_URL,{method:"GET",redirect:"follow",cache:"no-store"})
.then(response=>{
  if(!response.ok) throw new Error("Feed returned an HTTP error");
  return response.json();
})
.then(data=>{
  if(Array.isArray(data)) return data;
  if(data && Array.isArray(data.entries)) return data.entries;
  return [];
})
.catch(error=>{
  console.warn("Trying JSONP feed fallback.",error);
  return loadJsonp();
})
.then(data=>{
  entries=Array.isArray(data)?data:[];
  renderEntries();
})
.catch(error=>{
  console.error("Could not load research protocols:",error);
  document.getElementById("resultsCount").textContent="Unable to load contributions";
  document.getElementById("protocolGrid").replaceChildren(
    makeElement("div","empty-state",
      "The published contributions could not be loaded. Please try again later.")
  );
});
</script>
</body>
</html>
